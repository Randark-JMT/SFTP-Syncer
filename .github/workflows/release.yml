name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如 v1.0.0，将覆盖默认版本并作为 Release 标签）'
        required: true
        type: string
      prerelease:
        description: '标记为预发布版本'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GOARCH: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build SFTP-Syncer.exe
        run: wails build -tags desktop,production -ldflags "-X main.Version=${{ inputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFTP-Syncer-${{ inputs.version }}-windows-amd64
          path: build/bin/SFTP-Syncer.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: SFTP Syncer ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: build/bin/SFTP-Syncer.exe
